apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: checkout-zero-trust-isolation
  namespace: enterprise-checkout
spec:
  podSelector:
    matchLabels:
      app: enterprise-checkout-engine
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: ingress-gateway
      ports:
        - protocol: TCP
          port: 4000
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: postgres-ledger-db
      ports:
        - protocol: TCP
          port: 5432
